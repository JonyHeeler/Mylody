<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mylody</title>
    <link rel="stylesheet" href="/css/variables.css?v=aurora2">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/aurora.css?v=aurora2">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/track-card.css">
    <link rel="stylesheet" href="/css/review-card.css">
    <link rel="stylesheet" href="/css/skeleton.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/modal.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="aurora" id="auroraBg">
        <div class="aurora-glow aurora-glow--blue"></div>
        <div class="aurora-glow aurora-glow--violet"></div>
        <div class="aurora-glow aurora-glow--warm"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <span>Mylody</span>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="settingsBtn" title="设置">⚙️</button>
                <span class="status-dot" id="statusDot"></span>
            </div>
        </header>

        <main>
            <div class="track-card" id="trackCard">
                <div class="track-info">
                    <div class="track-title" id="trackTitle">等待播放...</div>
                    <div class="track-artist" id="trackArtist"></div>
                    <div class="track-album" id="trackAlbum"></div>
                </div>
                <div class="track-status" id="trackStatus">监听中</div>
            </div>

            <div class="review-card" id="reviewCard">
                <div class="review-placeholder" id="reviewPlaceholder">
                    <span class="review-icon">📝</span>
                    <p>等待乐评生成...</p>
                </div>
                <div class="review-content" id="reviewContent" style="display: none;">
                    <div class="review-header">
                        <div class="review-score" id="reviewScore">--</div>
                        <div class="review-emotion" id="reviewEmotion"></div>
                    </div>
                    <div class="review-section">
                        <div class="review-label">📝 概述</div>
                        <div class="review-text" id="reviewSummary"></div>
                    </div>
                    <div class="review-section">
                        <div class="review-label">🎹 乐理分析</div>
                        <div class="review-text" id="reviewTheory"></div>
                    </div>
                    <div class="review-section">
                        <div class="review-label">📖 背景</div>
                        <div class="review-text" id="reviewBackground"></div>
                    </div>
                    <div class="review-section">
                        <div class="review-label">🎧 推荐场景</div>
                        <div class="review-text" id="reviewScene"></div>
                    </div>
                    <div class="review-section" id="similarSection" style="display: none;">
                        <div class="review-label">🎶 相似推荐</div>
                        <div class="review-similar" id="reviewSimilar"></div>
                    </div>
                    <button class="btn-refresh" id="refreshBtn">🔄 刷新乐评</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <span id="uptime">运行时间: --</span>
            <span id="sourceApp">来源: --</span>
        </footer>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="btn-close" id="closeSettingsBtn">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>LLM 提供商</label>
                    <select id="configProvider">
                        <option value="openai">OpenAI</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="gemini">Gemini</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>模型名称</label>
                    <input type="text" id="configModel" placeholder="gpt-4o-mini">
                </div>
                <div class="form-group">
                    <label>轮询间隔 (秒)</label>
                    <input type="number" id="configInterval" min="1" max="60" value="2">
                </div>
                <div class="form-group">
                    <label>Web 端口</label>
                    <input type="number" id="configPort" min="1024" max="65535" value="8080">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelSettingsBtn">取消</button>
                <button class="btn-apple" id="saveSettingsBtn">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/state.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/aurora.js?v=aurora2"></script>
    <script src="/js/display.js?v=trackfix1"></script>
    <script src="/js/skeleton.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/app.js?v=aurora2"></script>
</body>
</html>
