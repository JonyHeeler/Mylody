<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mylody</title>
    <link rel="stylesheet" href="/css/variables.css?v=aurora2">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/aurora.css?v=aurora2">
    <link rel="stylesheet" href="/css/layout.css?v=statuslog1">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/track-card.css">
    <link rel="stylesheet" href="/css/review-card.css">
    <link rel="stylesheet" href="/css/skeleton.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link rel="stylesheet" href="/css/toast.css">
    <link rel="stylesheet" href="/css/modal.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="aurora" id="auroraBg">
        <div class="aurora-glow aurora-glow--blue"></div>
        <div class="aurora-glow aurora-glow--violet"></div>
        <div class="aurora-glow aurora-glow--warm"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎵</span>
                <span>Mylody</span>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="personalityBtn" title="音乐人格">🧭</button>
                <button class="btn-icon" id="settingsBtn" title="设置">⚙️</button>
                <span class="status-dot" id="statusDot"></span>
            </div>
        </header>

        <main>
            <div class="track-card" id="trackCard">
                <div class="track-info">
                    <div class="track-title" id="trackTitle">等待播放...</div>
                    <div class="track-artist" id="trackArtist"></div>
                    <div class="track-album" id="trackAlbum"></div>
                </div>
                <div class="track-status" id="trackStatus">监听中</div>
            </div>

            <div class="review-card" id="reviewCard">
                <div class="review-placeholder" id="reviewPlaceholder">
                    <span class="review-icon">📝</span>
                    <p>等待乐评生成...</p>
                </div>
                <div class="review-content" id="reviewContent" style="display: none;">
                    <div class="review-quote" id="reviewQuote"></div>
                    <div class="review-header">
                        <div class="review-score" id="reviewScore">--</div>
                        <div class="review-emotion" id="reviewEmotion"></div>
                    </div>
                    <div class="review-body" id="reviewBody"></div>
                    <div class="review-section" id="similarSection" style="display: none;">
                        <div class="review-label">🎶 相似推荐</div>
                        <div class="review-similar" id="reviewSimilar"></div>
                    </div>
                    <button class="btn-refresh" id="refreshBtn">🔄 刷新乐评</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <span id="uptime">运行时间: --</span>
            <span id="sourceApp">来源: --</span>
        </footer>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="status-log" id="statusLog" aria-live="polite">
        <div class="status-log-header">
            <div class="status-log-title">运行状态</div>
            <button class="status-log-toggle" id="statusLogToggle" title="收起/展开">▾</button>
        </div>
        <div class="status-log-body" id="statusLogBody">
            <div class="status-log-line">等待后端状态...</div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>缓存乐评</h2>
                <button class="btn-close" id="closeSettingsBtn">×</button>
            </div>
            <div class="modal-body">
                <div class="cache-toolbar">
                    <div class="cache-count" id="cacheCount">共 0 条</div>
                    <input class="cache-search" id="cacheSearch" type="search" placeholder="搜索歌曲、歌手或专辑">
                    <button class="cache-tool-btn" id="cacheRefreshBtn" type="button">刷新</button>
                    <button class="cache-tool-btn danger" id="cacheClearBtn" type="button">清空</button>
                </div>
                <div class="cache-list" id="cacheList">
                    <div class="cache-empty">正在加载缓存...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelSettingsBtn">关闭</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="personalityModal">
        <div class="modal personality-modal">
            <div class="modal-header">
                <h2>音乐人格</h2>
                <button class="btn-close" id="closePersonalityBtn">×</button>
            </div>
            <div class="modal-body">
                <div class="personality-meta" id="personalityMeta">准备生成...</div>
                <div class="personality-content" id="personalityContent"></div>
                <div class="personality-history" id="personalityHistoryList"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="regeneratePersonalityBtn">重新生成</button>
                <button class="btn-secondary" id="cancelPersonalityBtn">关闭</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal detail-modal">
            <div class="modal-header">
                <h2 id="detailTitle">详情</h2>
                <button class="btn-close" id="closeDetailBtn">×</button>
            </div>
            <div class="modal-body">
                <div class="detail-content" id="detailContent"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelDetailBtn">关闭</button>
            </div>
        </div>
    </div>

    <script src="/js/state.js"></script>
    <script src="/js/api.js?v=personality1"></script>
    <script src="/js/aurora.js?v=aurora2"></script>
    <script src="/js/display.js?v=albumonly1"></script>
    <script src="/js/skeleton.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/markdown.js?v=personality1"></script>
    <script src="/js/detail-modal.js?v=detail1"></script>
    <script src="/js/modal.js?v=cache2"></script>
    <script src="/js/personality-modal.js?v=personality2"></script>
    <script src="/js/app.js?v=personality2"></script>
</body>
</html>
